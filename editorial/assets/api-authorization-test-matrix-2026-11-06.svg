<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081A39"/><stop offset="1" stop-color="#164EAA"/></linearGradient></defs><rect width="1080" height="1350" fill="#fff"/><rect width="1080" height="16" fill="#166BE6"/><rect x="56" y="62" width="12" height="52" rx="5" fill="#1268DD"/><text x="87" y="98" fill="#0C2248" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" letter-spacing="1">AHMAD-IB  /  SECURITY RESEARCH</text><line x1="56" y1="134" x2="1024" y2="134" stroke="#DDE8F6" stroke-width="2"/><text x="56" y="222" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="57" font-weight="700" letter-spacing="0">CAN YOUR API PROVE</text><text x="56" y="296" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="57" font-weight="700" letter-spacing="0">WHO CAN ACCESS</text><text x="56" y="370" fill="#1268DD" font-family="Arial,DejaVu Sans,sans-serif" font-size="71" font-weight="700" letter-spacing="0">WHAT?</text><text x="58" y="426" fill="#365477" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="400" letter-spacing="0">Four checks for every sensitive request.</text><rect x="56" y="474" width="474" height="294" rx="24" fill="#F4F9FF" stroke="#D9E7F7" stroke-width="2"/><rect x="83" y="503" width="86" height="71" rx="14" fill="url(#g)"/><text x="99" y="553" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" letter-spacing="0">01</text><text x="83" y="623" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">IDENTITY</text><text x="83" y="678" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">Who is requesting</text><text x="83" y="717" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">this operation?</text><rect x="549" y="474" width="474" height="294" rx="24" fill="#F4F9FF" stroke="#D9E7F7" stroke-width="2"/><rect x="576" y="503" width="86" height="71" rx="14" fill="url(#g)"/><text x="592" y="553" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" letter-spacing="0">02</text><text x="576" y="623" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">OBJECT</text><text x="576" y="678" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">May they access this</text><text x="576" y="717" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">specific record?</text><rect x="56" y="799" width="474" height="294" rx="24" fill="#F4F9FF" stroke="#D9E7F7" stroke-width="2"/><rect x="83" y="828" width="86" height="71" rx="14" fill="url(#g)"/><text x="99" y="878" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" letter-spacing="0">03</text><text x="83" y="948" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">TENANT</text><text x="83" y="1003" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">Is the resource in</text><text x="83" y="1042" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">their organization?</text><rect x="549" y="799" width="474" height="294" rx="24" fill="#F4F9FF" stroke="#D9E7F7" stroke-width="2"/><rect x="576" y="828" width="86" height="71" rx="14" fill="url(#g)"/><text x="592" y="878" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" letter-spacing="0">04</text><text x="576" y="948" fill="#0B2045" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">ACTION</text><text x="576" y="1003" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">Can they read, edit,</text><text x="576" y="1042" fill="#35516E" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" letter-spacing="0">delete or export it?</text><rect x="56" y="1152" width="968" height="107" rx="20" fill="#0A2248"/><text x="83" y="1197" fill="#FFFFFF" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" letter-spacing="0">DENY BY DEFAULT</text><text x="83" y="1235" fill="#D9E9FF" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="400" letter-spacing="0">Verify permissions on the server, not in the interface.</text><text x="56" y="1314" fill="#5B718E" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" letter-spacing="0">Educational security guidance  •  ahmadib.onrender.com</text></svg>