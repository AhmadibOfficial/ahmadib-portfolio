ight="bold" fill="#fff">AN OBSERVED CAMPAIGN, NOT MY DISCOVERY</text><text x="540" y="1260" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#4d6685">Source: Citizen Lab  ·  Ahmad-IB Research Journal</text><text x="540" y="1301" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4d6685">Educational analysis  |  ahmadib.onrender.com</text></svg>